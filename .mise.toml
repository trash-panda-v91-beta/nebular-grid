[env]
_.fnox-env = { tools = true }
FLATE_PATH = "{{config_root}}/clusters/psb/flux/cluster"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[tools]
actionlint = "1.7.12"
fnox = "1.34.0"
helm = "4.2.4"
helmfile = "1.7.4"
hk = "1.56.1"
kustomize = "5.8.1"
pkl = "0.32.1"
uv = "0.12.5"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
yq = "4.53.6"
"github:mitsuhiko/minijinja[minijinja-cli]" = "2.24.0"

[settings.pipx]
uvx = true

[tasks.check]
description = "Run all checks"
run = "hk check --all"

[tasks.test]
description = "Run tests (none configured yet)"
run = "echo no tests configured"

[tasks.fix]
description = "Fix all issues"
run = "hk fix --all"
