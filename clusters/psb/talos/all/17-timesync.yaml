---
apiVersion: v1alpha1
kind: TimeSyncConfig
enabled: true
ntp:
  servers:
    - asc.sto.bar.internal
    # the name first, then the same host by address: the nodes can hold a
    # stale DNS answer and the NTP client does not ask again for long
    - 10.1.10.225
    # last resort, the NAS is a single point of failure for time
    - time.cloudflare.com
