---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  # Without this any namespace that can create an ExternalSecret can read the
  # whole 1Password vault. The provider cannot be scoped below vault level, so
  # this list is the control: a new namespace gets vault access only by being
  # added here.
  conditions:
    - namespaces:
        - ai
        - cert-manager
        - database
        - default
        - downloads
        - external-secrets
        - flux-system
        - home-automation
        - media
        - network
        - observability
        - security
        - selfhosted
        - system
  provider:
    onepassword:
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local:8080
      vaults:
        NebularGrid: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-secret
            key: token
            namespace: external-secrets
