---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: unifi-network-mcp
spec:
  alias: unifi_network_mcp
  # The proxy is in ai and this CR is not, so registration has to name it.
  # Without these the Deployment is created but the tool never appears in
  # litellm's mcp_servers - the MCP answers on its own URL and is unreachable
  # through the gateway.
  proxyRef: litellm
  proxyNamespace: ai
  workload:
    image: ghcr.io/sirkirby/unifi-network-mcp:0.45.1@sha256:17e8d34e871d1869b43663922e172a91904154a1f3d27e99fd681321eb17ddd9
    port: 3000
    env:
      - name: UNIFI_HOST
        value: "10.1.0.1"
      - name: UNIFI_PORT
        value: "443"
      - name: UNIFI_VERIFY_SSL
        value: "false"
      - name: UNIFI_USERNAME
        valueFrom:
          secretKeyRef:
            name: unifi-network-mcp-secret
            key: username
      - name: UNIFI_PASSWORD
        valueFrom:
          secretKeyRef:
            name: unifi-network-mcp-secret
            key: password
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: unifi-network-mcp-secret
            key: api_key
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_HTTP_FORCE
        value: "true"
      - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
        value: "false"
      - name: UNIFI_MCP_HOST
        value: "0.0.0.0"
      - name: UNIFI_MCP_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,unifi-network-mcp,unifi-network-mcp.infra-mgmt.svc,unifi-network-mcp.infra-mgmt.svc.cluster.local"
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
