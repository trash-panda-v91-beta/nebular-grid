---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-management
  labels:
    # Published like envoy-internal, because the same managed phones need to
    # reach the monitoring UIs. See the task note on why internal names have
    # to be public here.
    external-dns/controller: externaldns-cloudflare
  annotations:
    external-dns.kubernetes.io/target: &hostname ingress-mgmt.nebular-grid.space
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: 10.1.6.45
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: nebular-grid.space-tls
