---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-management
  # Deliberately NOT published. The monitoring and admin UIs are reachable on
  # the LAN and over the VPN, where the gateway answers the names through UniFi
  # DNS. Nothing here needs to be resolvable from outside, and unlike the app
  # names these are not already in the public repo.
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 10.1.60.45
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: nebular-grid.space-tls
