---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: externaldns-cloudflare
spec:
  chartRef:
    kind: OCIRepository
    name: externaldns-cloudflare
  interval: 30m
  values:
    fullnameOverride: &name externaldns-cloudflare
    logLevel: info
    domainFilters:
      - nebular-grid.space
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: externaldns-cloudflare-secrets
            key: cloudflare_api_token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      # Only what is genuinely external. The internal gateway has no
      # external-dns/controller label on purpose: its names resolve from the
      # gateway for LAN and VPN clients, and publishing them leaked the whole
      # internal topology to the public zone. --gateway-name cannot be repeated
      # in external-dns v0.21.0 (CrashLoopBackOff), so this is a label filter.
      - --gateway-label-filter=external-dns/controller=externaldns-cloudflare
    podAnnotations:
      secret.reloader.stakater.com/reload: externaldns-cloudflare-secrets
    policy: sync
    provider:
      name: cloudflare
    resources:
      requests:
        cpu: 13m
        memory: 42M
      limits:
        memory: 42M
    serviceMonitor:
      enabled: true
    sources:
      - gateway-httproute
      - crd
    triggerLoopOnEvent: true
    txtOwnerId: main
    txtPrefix: "k8s."

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: *name
            patch: |-
              - op: add
                path: /spec/template/spec/enableServiceLinks
                value: false
