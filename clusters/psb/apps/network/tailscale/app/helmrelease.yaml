---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
  interval: 30m
  values:
    operatorConfig:
      hostname: "tailscale-operator"
      defaultTags: "tag:nebular-grid"
      # API server proxy (operate cluster via kubectl over tailnet).
      # We don't need it for the use-case here; disable to reduce surface.
      apiServerProxyConfig:
        mode: "false"
    proxyConfig:
      defaultProxyClass: tailscale-tun
      defaultTags: "tag:nebular-grid"
    # Provide the OAuth client via a Secret so the operator can create
    # ephemeral tagged devices automatically (no manual auth-key rotation).
    oauthSecretVolume:
      secret:
        secretName: tailscale-oauth
    ingressClass:
      create: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
