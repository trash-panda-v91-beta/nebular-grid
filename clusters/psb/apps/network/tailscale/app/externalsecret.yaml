---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-oauth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tailscale-oauth
    creationPolicy: Owner
  data:
    # 1Password item: create a Tailscale OAuth client in the admin console
    # (Settings > OAuth clients) with scopes write_keys + write_devices +
    # read_devices and a tag `tag:nebular-grid`. Fill in the item's properties.
    # The operator reads these two keys from a Secret (client_id/client_secret).
    - secretKey: client_id
      remoteRef:
        key: Tailscale OAuth Client
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: Tailscale OAuth Client
        property: client_secret
