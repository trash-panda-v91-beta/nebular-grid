---
# Subnet router: expose the cluster's internal subnets to the tailnet so
# remote clients (phone/Mac) can reach the internal services + resolver over
# the overlay. This mirrors billimek/k8s-gitops (the reference for this chart).
# Split DNS for *.nebular-grid.space is configured in the Tailscale admin
# console (Magic DNS), not in-cluster.
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: psb-internal
spec:
  # Hostname prefix for the connector machines.
  hostnamePrefix: "psb-connector"
  # Tag for ACL policy matching.
  tags:
    - "tag:nebular-grid"
  appConnector:
    # Services subnet (envoy-internal at 10.1.6.42)
    # Default subnet (UniFi DNS/resolver 10.1.0.1)
    routes:
      - 10.1.6.0/24
      - 10.1.0.0/24
