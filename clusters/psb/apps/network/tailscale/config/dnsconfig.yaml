---
# Configure Split DNS so names under nebular-grid.space are answered by your
# on-prem resolver (10.1.0.1 - UniFi DNS) for tailnet clients, instead of
# falling through to public DNS. This is what lets the managed phone resolve
# *.nebular-grid.space over the tailnet without public DNS records.
# Requires the Connector to advertise 10.1.0.0/24 so clients can reach the
# resolver (see connector.yaml).
apiVersion: tailscale.com/v1alpha1
kind: DNSConfig
metadata:
  name: nebular-grid-split-dns
spec:
  nameserver:
    ip: "10.1.0.1"
    port: 53
