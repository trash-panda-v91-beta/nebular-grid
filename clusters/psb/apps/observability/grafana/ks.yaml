---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: grafana-operator
  path: "./clusters/psb/apps/observability/grafana/operator"
  prune: true
  targetNamespace: observability
  timeout: 5m
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: grafana-instance
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: grafana-operator
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kanidm
      namespace: security
  path: "./clusters/psb/apps/observability/grafana/instance"
  postBuild:
    substitute:
      APP: grafana
      APP_NAMESPACE: observability
      OIDC_DISPLAY_NAME: Grafana
      OIDC_GROUP: admins
      OIDC_CALLBACK: /login/generic_oauth
  prune: true
  targetNamespace: observability
  timeout: 5m
  wait: true
