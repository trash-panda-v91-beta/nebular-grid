---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: "./clusters/psb/apps/observability/victoria-logs/app"
  prune: true
  targetNamespace: observability
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-collector
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs-collector
  dependsOn:
    - name: victoria-logs
  path: "./clusters/psb/apps/observability/victoria-logs/collector"
  prune: true
  targetNamespace: observability
  timeout: 5m
  wait: false
