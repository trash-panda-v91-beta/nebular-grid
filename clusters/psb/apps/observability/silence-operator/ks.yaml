---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silence-operator
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: silence-operator
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: silence-operator
      namespace: observability
  path: ./clusters/psb/apps/observability/silence-operator/app
  prune: true
  targetNamespace: observability
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silence-operator-silences
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: silence-operator
  dependsOn:
    - name: silence-operator
      namespace: observability
  path: ./clusters/psb/apps/observability/silence-operator/silences
  prune: true
  targetNamespace: observability
  timeout: 5m
  wait: false
