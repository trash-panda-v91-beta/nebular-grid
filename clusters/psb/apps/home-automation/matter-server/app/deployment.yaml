---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
      annotations:
        reloader.stakater.com/auto: "true"
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"multus-iot",
            "namespace": "network",
            "ips": ["10.1.30.153/24", "fd12:3456:789a:303::153/64"],
            "mac": "3e:59:e4:f7:43:09"
          }]
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        sysctls:
          - name: net.ipv6.conf.net1.accept_ra
            value: "2"
          - name: net.ipv6.conf.net1.accept_ra_defrtr
            value: "1"
          - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
            value: "128"
      initContainers:
        # One-time ownership fix: the data was previously written by the Python
        # matter-server running as root (mode 600). The JS matter-server runs
        # as UID/GID 2000 and must be able to read & migrate that data.
        - name: chown-data
          image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:1b8e824d9b6c8afed012fd7047ece1f924778c257afc2e5e56435a51a914664a
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -d /data ]; then
                chown -R 2000:2000 /data || true
                chmod -R u+rwX,go+rX /data || true
              fi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:1b8e824d9b6c8afed012fd7047ece1f924778c257afc2e5e56435a51a914664a
          imagePullPolicy: IfNotPresent
          args:
            - --storage-path=/data
            - --primary-interface=net1
            - --log-level=info
          env:
            - name: TZ
              value: "Europe/Prague"
            - name: STORAGE_PATH
              value: "/data"
            - name: PRIMARY_INTERFACE
              value: "net1"
            - name: LOG_LEVEL
              value: "info"
            - name: PRODUCTION_MODE
              value: "true"
            - name: BLE_PROXY
              value: "true"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          ports:
            - name: http
              containerPort: 5580
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
        - name: tmp
          emptyDir: {}
