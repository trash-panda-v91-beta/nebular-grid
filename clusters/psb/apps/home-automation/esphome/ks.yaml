---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: esphome
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: esphome
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: system
    - name: multus-networks
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: "./clusters/psb/apps/home-automation/esphome/app"
  postBuild:
    substitute:
      APP: esphome
      DOMAIN: asc.internal
      TIMEZONE: Europe/Prague
      KOPIUR_CLAIM: esphome-config
      KOPIUR_CAPACITY: 5Gi
  prune: true
  targetNamespace: home-automation
  timeout: 5m
  wait: false
