---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: zigbee2mqtt
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler/zigbee-adapter
    - ../../../../components/oidc/envoy
  dependsOn:
    - name: kopiur
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kanidm
      namespace: security
  path: "./clusters/psb/apps/home-automation/zigbee2mqtt/app"
  postBuild:
    substitute:
      APP: zigbee2mqtt
      APP_NAMESPACE: home-automation
      KOPIUR_CLAIM: zigbee2mqtt-data
      OIDC_DISPLAY_NAME: Zigbee2MQTT
      OIDC_GROUP: admins
  prune: true
  targetNamespace: home-automation
  timeout: 5m
  wait: false
