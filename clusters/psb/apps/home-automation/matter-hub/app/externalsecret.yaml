---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matter-hub
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: matter-hub-secret
    creationPolicy: Owner
  data:
    - secretKey: home_assistant_access_token
      remoteRef:
        key: Matter Hub HASS token
        property: password
