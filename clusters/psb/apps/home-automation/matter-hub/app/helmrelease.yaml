---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-hub
spec:
  chartRef:
    kind: OCIRepository
    name: matter-hub
  interval: 30m
  values:
    controllers:
      matter-hub:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "network",
                "ips": ["10.1.30.154/24", "fd12:3456:789a:303::154/64"],
                "mac": "3e:59:e4:f7:43:0a"
              }]
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            sysctls:
              - name: net.ipv6.conf.net1.accept_ra
                value: "2"
              - name: net.ipv6.conf.net1.accept_ra_defrtr
                value: "1"
              - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
                value: "128"
        containers:
          app:
            image:
              repository: ghcr.io/riddix/home-assistant-matter-hub
              tag: 2.0.59@sha256:40f6df4ef6b800f32fe3ee8496ffbeaa0c0283590d731267fa3bd2c89830ce5e
            env:
              TZ: "Europe/Prague"
              HAMH_HOME_ASSISTANT_URL: "http://10.1.30.151:8123"
              HAMH_HOME_ASSISTANT_ACCESS_TOKEN:
                secretKeyRef:
                  name: matter-hub-secret
                  key: home_assistant_access_token
              HAMH_WEB_PORT: "8482"
              HAMH_LOG_LEVEL: "info"
              HAMH_MDNS_NETWORK_INTERFACE: "net1"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: 8482
    persistence:
      data:
        existingClaim: matter-hub-data
        advancedMounts:
          matter-hub:
            app:
              - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - matter-hub.nebular-grid.space
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8482
