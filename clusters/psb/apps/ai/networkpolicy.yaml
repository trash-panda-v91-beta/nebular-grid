---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Namespace-wide default deny for ingress. Four external callers, all deliberate:
# the public-dns gateway, `selfhosted` (papers pulls summaries through litellm on
# 4000), `observability` (prometheus scrapes llmkube), and the API server, which
# calls two admission webhooks in here. Both webhooks run failurePolicy: Fail, so
# missing the kube-apiserver entity below would not break the webhooks - it would
# break creating the objects they validate.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-ingress
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: envoy-internal-public-dns
            k8s:io.kubernetes.pod.namespace: network
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
    - # papers pulls summaries through litellm
      fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - # prometheus scrapes the llmkube metrics
      fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
    - # the API server calls the litellm-operator and llmkube validating webhooks
      fromEntities:
        - kube-apiserver
    - # kubelet probes come from the node, not from a pod
      fromEntities:
        - host
