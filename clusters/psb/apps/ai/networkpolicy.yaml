---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Namespace-wide default deny for ingress. Three external callers, all deliberate:
# the public-dns gateway, `selfhosted` (papers pulls summaries through litellm,
# and the agent reads selfhosted APIs), and the API server, which calls two
# admission webhooks in here. Both webhooks run failurePolicy: Fail, so
# missing the kube-apiserver entity below would not break the webhooks - it would
# break creating the objects they validate.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-ingress
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: envoy-internal-public-dns
            k8s:io.kubernetes.pod.namespace: network
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
    # no toPorts on this peer: a reply to a connection opened from ai arrives on
    # an ephemeral port, so a port filter here drops it whenever the selfhosted
    # pod runs on the same node as the caller. Remote peers slip through as
    # remote-node, which is why this only shows up on one node.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
    - # the API server calls the litellm-operator and llmkube validating webhooks
      fromEntities:
        - kube-apiserver
    - # kubelet probes come from the node, not from a pod
      fromEntities:
        - host
