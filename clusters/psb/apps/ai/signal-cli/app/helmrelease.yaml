---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signal-cli
spec:
  chartRef:
    kind: OCIRepository
    name: signal-cli
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      signal-cli:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/asamk/signal-cli
              tag: "0.14.7"
            command:
              - /bin/sh
              - -c
            args:
              # multi-account mode: serves whatever accounts are linked in the config dir
              - /opt/signal-cli/bin/signal-cli --config=/var/lib/signal-cli daemon --http 0.0.0.0:8080
            env:
              TZ: Europe/Prague
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/check
                    port: 8080
                  periodSeconds: 5
                  initialDelaySeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/check
                    port: 8080
                  periodSeconds: 30
                  initialDelaySeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/check
                    port: 8080
                  periodSeconds: 10
                  initialDelaySeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: signal-cli
        ports:
          http:
            port: 8080
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /var/lib/signal-cli
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
