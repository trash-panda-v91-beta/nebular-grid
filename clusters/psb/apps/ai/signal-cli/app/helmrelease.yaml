---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signal-cli
spec:
  chartRef:
    kind: OCIRepository
    name: signal-cli
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      signal-cli:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: docker.io/bbernhard/signal-cli-rest-api
              tag: "0.92"
            env:
              MODE: json-rpc
              TZ: Europe/Prague
              # entrypoint remaps its built-in signal-api user to match fsGroup; repo convention is 2000
              SIGNAL_CLI_UID: "2000"
              SIGNAL_CLI_GID: "2000"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  # entrypoint runs usermod/groupmod/chown then setpriv down to signal-api (uid 2000)
                  - CHOWN
                  - SETUID
                  - SETGID
    service:
      app:
        controller: signal-cli
        ports:
          jsonrpc:
            port: 8080
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          signal-cli:
            app:
              - path: /home/.local/share/signal-cli
