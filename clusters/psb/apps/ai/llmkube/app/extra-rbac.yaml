---
# The chart's Role omits leases in coordination.k8s.io, but the controller's
# watch canary writes one every minute. Each write is denied, the canary logs
# "watch canary write failed" and the process exits cleanly - which Kubernetes
# then restarts. The pod showed 607 restarts, all exit 0, none of them a crash.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmkube-controller-manager-lease
  labels:
    app.kubernetes.io/name: llmkube-controller-manager
    app.kubernetes.io/instance: llmkube
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmkube-controller-manager-lease
  labels:
    app.kubernetes.io/name: llmkube-controller-manager
    app.kubernetes.io/instance: llmkube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmkube-controller-manager-lease
subjects:
  - kind: ServiceAccount
    name: llmkube-controller-manager
    namespace: ai
