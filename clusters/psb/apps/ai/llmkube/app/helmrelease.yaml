---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 30m
  values:
    namespace: ai
    crds:
      install: true
      keep: true
    controllerManager:
      replicaCount: 1
      leaderElection:
        enabled: false
      # The watch canary writes a coordination.k8s.io lease every minute and
      # the chart's Role does not grant it. Each write is denied, the canary
      # exits and Kubernetes restarts the pod - 607 restarts, all exit 0.
      # Disabling it is what other installs of this chart do; the pod is
      # single-replica and the canary only catches a stuck watch.
      watchCanary:
        interval: 0s
      nodeSelector:
        kubernetes.io/hostname: midori
      resources:
        requests:
          cpu: 10m
          memory: 78Mi
        limits:
          memory: 90Mi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    metrics:
      enabled: false
    prometheus:
      serviceMonitor:
        enabled: false
      inferencePodMonitor:
        enabled: false
      prometheusRule:
        enabled: false
    modelCache:
      enabled: true
      # perService gives each InferenceService its own node-local cache that
      # binds on the node its pod schedules to. WaitForFirstConsumer forces the
      # rollout pod onto that same node, so a single-replica RWO workload never
      # deadlocks on a second pod that cannot mount the RWO volume (the bug that
      # kept qwen3-reranker stuck in Init:0/3).
      mode: perService
      size: 100Gi
      storageClass: openebs-hostpath
      accessMode: ReadWriteOnce
      mountPath: /models
