---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: qmd
spec:
  alias: qmd
  transport: sse
  workload:
    image: docker.io/supercorp/supergateway:4.1.0@sha256:1938c43538a5308bce07d58028e9de00b7acfecb40b39b059b2f3931800ad910
    port: 8000
    path: /sse
    args:
      - --stdio
      - "npx -y @tobilu/qmd@2.8.3 mcp"
      - --port
      - "8000"
    volumes:
      - name: vault
        nfs:
          server: asc.internal
          path: /mnt/tank/apps/vault
          readOnly: true
      - name: cache
        persistentVolumeClaim:
          claimName: qmd-cache
    volumeMounts:
      - name: vault
        mountPath: /vault
        readOnly: true
      - name: cache
        mountPath: /root/.cache/qmd
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 6Gi
