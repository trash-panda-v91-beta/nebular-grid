---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: qmd
spec:
  alias: qmd
  transport: sse
  workload:
    image: docker.io/library/node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    port: 8000
    path: /sse
    command:
      - sh
      - -c
    args:
      - npx -y supergateway@4.2.0 --stdio "npx -y @tobilu/qmd@2.8.3 mcp" --port 8000
    volumes:
      - name: vault
        nfs:
          server: asc.internal
          path: /mnt/tank/apps/vault
          readOnly: true
      - name: cache
        persistentVolumeClaim:
          claimName: qmd-cache
    volumeMounts:
      - name: vault
        mountPath: /vault
        readOnly: true
      - name: cache
        mountPath: /root/.cache/qmd
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 6Gi
