---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# TrueNAS API key (System Settings > API Keys). Create a 1Password field
# `api_key` on the `truenas` item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: truenas-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: TRUENAS_API_KEY
      remoteRef:
        key: truenas
        property: api_key
