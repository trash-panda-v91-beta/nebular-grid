---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: truenas-mcp
spec:
  alias: truenas_mcp
  transport: http
  workload:
    image: ghcr.io/trash-panda-v91-beta/truenas-mcp:v1.0.0@sha256:c95cf13939f012463c3929e6ffb0419f44563bbaae9f2b464941b9b6dde6f0d9
    port: 8000
    path: /mcp
    env:
      # TrueNAS middleware websocket. asc.nebular-grid.space is the UI/API name and has a Let's Encrypt
      # cert the NAS renews itself; asc.sto.bar.internal stays the name for NFS and NTP.
      - name: TRUENAS_URI
        value: wss://asc.nebular-grid.space/api/current
      - name: TRUENAS_VERIFY_SSL
        value: "true"
      - name: TRUENAS_API_KEY
        valueFrom:
          secretKeyRef:
            name: truenas-mcp-secret
            key: TRUENAS_API_KEY
      # FastMCP serves streamable-http from FASTMCP_* env vars - no code change
      - name: FASTMCP_TRANSPORT
        value: streamable-http
      - name: FASTMCP_HOST
        value: 0.0.0.0
      - name: FASTMCP_PORT
        value: "8000"
      - name: FASTMCP_STREAMABLE_HTTP_PATH
        value: /mcp
