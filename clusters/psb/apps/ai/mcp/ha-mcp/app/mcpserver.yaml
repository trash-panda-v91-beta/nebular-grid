---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: ha-mcp
spec:
  alias: ha_mcp
  # ha-mcp runs inside Home Assistant (HA-MCP integration); litellm fronts its
  # webhook so clients need no Home Assistant credential of their own. The URL
  # carries the webhook id, so it comes from 1Password instead of this file.
  url: os.environ/HA_MCP_URL
  transport: http
  authType: bearer_token
  authTokenRef:
    name: ha-mcp-secret
    key: HA_MCP_TOKEN
