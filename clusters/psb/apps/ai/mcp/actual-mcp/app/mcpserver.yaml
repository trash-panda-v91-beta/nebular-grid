---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: actual-mcp
spec:
  alias: actual_mcp
  transport: http
  workload:
    image: ghcr.io/agigante80/actual-mcp-server:0.11.0@sha256:f2ff990bcfd67910265034beb2632a797a225e460d278c341fc8770a1704e08e
    port: 3600
    path: /http
    env:
      - name: MCP_ALLOW_UNAUTHENTICATED
        value: "true"
      - name: ACTUAL_SERVER_URL
        value: http://actual.selfhosted.svc.cluster.local:5006
      - name: ACTUAL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: actual-mcp-secret
            key: ACTUAL_PASSWORD
      - name: ACTUAL_BUDGET_SYNC_ID
        valueFrom:
          secretKeyRef:
            name: actual-mcp-secret
            key: ACTUAL_BUDGET_SYNC_ID
      # Session management - prevent pool exhaustion during burst MCP calls
      # Explicitly enable connection pooling (image default is true, but make it
      # explicit so sessions are reused from the pool instead of spawned per call).
      - name: USE_CONNECTION_POOL
        value: "true"
      # Ceiling on concurrent MCP sessions. Generous headroom for bursts; pooling
      # reuses sessions so this is defense-in-depth, not the primary bottleneck.
      - name: MAX_CONCURRENT_SESSIONS
        value: "50"
      - name: SESSION_IDLE_TIMEOUT_MINUTES
        value: "2"
      # Increase per-operation timeout - bank sync needs more than 30s
      - name: ACTUAL_OP_TIMEOUT_MS
        value: "60000"
      # Deeper upstream Actual API pool: burst tool calls (e.g. linking transfer
      # pairs) serialize on the global API mutex; raising pool depth to the server's
      # documented 15-session ceiling reduces 503 pool-exhaustion under bursts.
      - name: ACTUAL_API_CONCURRENCY
        value: "15"
    volumes:
      - name: data
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /app/data
