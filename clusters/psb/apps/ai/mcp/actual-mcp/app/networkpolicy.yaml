---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: actual-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: actual-mcp
  policyTypes:
    - Ingress
  # Only the LiteLLM gateway calls this server; everything else in the cluster
  # has no business reading the budget.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 3600
          protocol: TCP
