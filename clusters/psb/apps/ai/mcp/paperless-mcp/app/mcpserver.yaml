---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: paperless-mcp
spec:
  alias: paperless_mcp
  transport: http
  # This image authenticates callers with the Paperless API token itself and
  # forwards that token upstream, so one value serves as both gate and credential.
  authType: bearer_token
  authTokenRef:
    name: paperless-mcp-secret
    key: PAPERLESS_API_TOKEN
  workload:
    # upstream publishes no semver tags, only :latest and per-commit shas
    image: ghcr.io/baruchiro/paperless-mcp:latest@sha256:7a793eeeb2ef9ea43175bf6b43b2179cc7c5b7e5484b6aecea8984a61d1ffe2d
    port: 3000
    path: /mcp
    env:
      - name: PAPERLESS_URL
        value: http://paperless.selfhosted.svc.cluster.local:8000
      - name: PAPERLESS_PUBLIC_URL
        value: https://paperless.nebular-grid.space
      - name: PAPERLESS_API_KEY
        valueFrom:
          secretKeyRef:
            name: paperless-mcp-secret
            key: PAPERLESS_API_TOKEN
