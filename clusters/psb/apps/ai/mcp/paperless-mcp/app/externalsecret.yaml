---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# API token from Paperless (Settings > Profile > API token). The `Paperless`
# 1Password item already carries it as the `api token` field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: PAPERLESS_API_TOKEN
      remoteRef:
        key: Paperless
        property: api token
