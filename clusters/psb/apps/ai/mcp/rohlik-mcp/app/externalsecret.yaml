---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Rohlik account credentials, sent to mcp.rohlik.cz as the rhl-email and rhl-pass headers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rohlik-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rohlik-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: RHL_EMAIL
      remoteRef:
        key: Rohlik
        property: username
    - secretKey: RHL_PASS
      remoteRef:
        key: Rohlik
        property: password
