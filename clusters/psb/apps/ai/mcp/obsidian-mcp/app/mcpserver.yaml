---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: obsidian-mcp
spec:
  alias: obsidian_mcp
  transport: sse
  workload:
    image: docker.io/supercorp/supergateway:4.2.0@sha256:61ffc26bf72b0b252a3aba926ff67b9d78e7181d19905f1f9c8fc6b7f6c3ad3d
    port: 8000
    path: /sse
    args:
      - --stdio
      - "npx -y @bitbonsai/mcpvault@latest /vault"
      - --port
      - "8000"
    volumes:
      - name: vault
        nfs:
          server: asc.internal
          path: /mnt/tank/apps/vault
    volumeMounts:
      - name: vault
        mountPath: /vault
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 512Mi
