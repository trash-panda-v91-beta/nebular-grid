---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# API token from Mealie (user settings > API Tokens). Add a 1Password field
# `api_token` on the existing `Mealie` item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mealie-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: MEALIE_API_TOKEN
      remoteRef:
        key: Mealie
        property: api_token
