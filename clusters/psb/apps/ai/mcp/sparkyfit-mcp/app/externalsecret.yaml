---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# MCP API token from SparkyFitness (Settings > Developer & Integrations > API Key
# Management). 1Password item `SparkyFitness MCP`, field `api token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfit-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sparkyfit-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: SPARKY_FITNESS_MCP_TOKEN
      remoteRef:
        key: SparkyFitness MCP
        property: api token
