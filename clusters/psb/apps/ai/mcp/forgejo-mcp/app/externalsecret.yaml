---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Read-only Forgejo identity for the agent. Its own user, its own token, so
# revoking it cannot affect releases or the runner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: forgejo-mcp
        property: token
