---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 30m
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        initContainers:
          copy-agent-source:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # hermes-agent >= v2026.7.x ships root-only playwright .deps files;
                # tolerate those but still fail on any other copy error.
                cp -r /opt/hermes/. /agent-src/ 2>/tmp/cp.err || true
                if grep -v 'Permission denied' /tmp/cp.err; then exit 1; fi
                test -e /agent-src/.venv
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
          install-tools:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            command:
              - /bin/sh
              - -c
              - |
                set -e
                mkdir -p /opt/data/.local/bin /opt/data/.local/go

                if [ ! -f /opt/data/.local/bin/gh ]; then
                  cd /tmp
                  curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                  tar xzf gh.tar.gz
                  cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                  rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                fi

                if [ ! -f /opt/data/.local/go/bin/go ]; then
                  cd /tmp
                  curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                  tar xzf go.tar.gz
                  mv go /opt/data/.local/
                  rm -rf go.tar.gz
                fi

                if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                  export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                  mkdir -p $HOMEBREW_PREFIX
                  git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            args:
              - gateway
              - run
              - --no-supervise
            env:
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              GOPATH: /opt/data/go
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_CRON_TIMEOUT: 0
              HOME: /opt/data
              HOMEBREW_CELLAR: /opt/data/.local/homebrew/Cellar
              HOMEBREW_PREFIX: /opt/data/.local/homebrew
              HOMEBREW_REPOSITORY: /opt/data/.local/homebrew
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: LITELLM_API_KEY
              MATRIX_ENCRYPTION: "true"
              API_SERVER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: API_SERVER_KEY
              PATH: /opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/go/bin:/opt/data/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
              SUMMARY_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: LITELLM_API_KEY
              SUMMARY_LLM_MODEL: google/gemma-4-31b-it
              SUMMARY_LLM_URL: http://litellm.ai:4000/v1
              TERM: xterm-256color
              TERMINAL_MAX_FOREGROUND_TIMEOUT: "1800"
              HERMES_DASHBOARD: "1"
              TZ: "America/Chicago"
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - SETGID
                  - SETUID
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              # Removed container-level runAsUser: 0 so pod-level runAsUser: 1000 applies.
              # This fixes auth.json being created as root and unreadable by the hermes process.
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.130.0@sha256:fa367e7eddd303a95c736f7aede351cdee9036a7383cecfd8786bb5bbe78c13b
            args:
              - --auth
              - none
              - --user-data-dir
              - /opt/data/.vscode
              - --extensions-dir
              - /opt/data/.vscode
              - --port
              - "12321"
              - /opt/data
            env:
              TZ: "America/Chicago"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        service:
          main:
            ports:
              http:
                port: 8642
        rawResources:
          hermes-rbac:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: hermes-read-all
            rules:
              - apiGroups:
                  - ""
                resources:
                  - namespaces
                  - nodes
                  - persistentvolumes
                  - persistentvolumeclaims
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "apps"
                resources:
                  - deployments
                  - replicasets
                  - statefulsets
                  - daemonsets
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "batch"
                resources:
                  - jobs
                  - cronjobs
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "networking.k8s.io"
                resources:
                  - ingresses
                  - networkpolicies
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "storage.k8s.io"
                resources:
                  - storageclasses
                  - csinodes
                  - csidrivers
                  - volumeattachments
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "helm.toolkit.fluxcd.io"
                resources:
                  - "helmreleases"
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "kustomize.toolkit.fluxcd.io"
                resources:
                  - "kustomizations"
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "source.toolkit.fluxcd.io"
                resources:
                  - gitrepositories
                  - helmrepositories
                  - ocirepositories
                  - buckets
                  - helmcharts
                verbs:
                  - "get"
                  - "list"
                  - "watch"
              - apiGroups:
                  - "external-secrets.io"
                resources:
                  - externalsecrets
                  - secretstores
                  - clustersecretstores
                verbs:
                  - "get"
                  - "list"
                  - "watch"
          hermes-pod-delete:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: hermes-pod-delete
            rules:
              - apiGroups:
                  - ""
                resources:
                  - pods
                verbs:
                  - "delete"
          hermes-exec-deploy:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: hermes-exec-deploy
              namespace: ai
            rules:
              - apiGroups:
                  - ""
                resources:
                  - pods/exec
                verbs:
                  - "create"
              - apiGroups:
                  - "apps"
                resources:
                  - deployments
                verbs:
                  - "patch"
                  - "update"
          hermes-read-all-binding:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: hermes-read-all
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: hermes-read-all
            subjects:
              - kind: ServiceAccount
                name: hermes
                namespace: ai
          hermes-pod-delete-binding:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: hermes-pod-delete
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: hermes-pod-delete
            subjects:
              - kind: ServiceAccount
                name: hermes
                namespace: ai
          hermes-exec-deploy-binding:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: hermes-exec-deploy
              namespace: ai
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: hermes-exec-deploy
            subjects:
              - kind: ServiceAccount
                name: hermes
                namespace: ai
    serviceAccount:
      hermes: {}
