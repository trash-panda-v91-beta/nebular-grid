---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-configmap
data:
  env: |-
    MATRIX_HOMESERVER=https://matrix.nebular-grid.space
    MATRIX_USER_ID=@cl4:nebular-grid.space
    MATRIX_ALLOWED_USERS=@petr:nebular-grid.space,@aneta:nebular-grid.space
    MATRIX_HOME_ROOM=!6DsViCbuo5Gq4_cfP9PAXSCoomvUnsHIk822BYlJLpA
    MATRIX_HOME_ROOM_THREAD_ID=
    MATRIX_DEVICE_ID=d8OUEibR8u
    MEMINI_BASE_URL=http://memini.ai.svc.cluster.local:8080
    MEMINI_NAMESPACE=hermes
    GITHUB_APP_ID=Iv23libVn1XkTAjpYL9M
    GITHUB_APP_PRIVATE_KEY_PATH=/opt/data/.keys/github-app.pem
    GITHUB_APP_INSTALLATION_ID=
    SIGNAL_HTTP_URL=http://signal-cli.ai.svc.cluster.local:8080
    SIGNAL_ALLOWED_USERS=petik.10
    SEARXNG_URL=http://searxng.selfhosted.svc.cluster.local:8080
    REPOS=/opt/data/repos
  config.yaml: |-
    model:
      default: deepseek-v4.1-flash
      provider: neuralwatt
      base_url: https://api.neuralwatt.com/v1
      api_mode: chat_completions
    database:
      journal_mode: wal
    agent:
      max_turns: 500
      verbose: false
      reasoning_effort: medium
      personalities:
        helpful: You are a helpful, friendly AI assistant.
        concise: You are a concise assistant. Keep responses brief and to the point.
        technical: You are a technical expert. Provide detailed, accurate technical information.
        creative: You are a creative assistant. Think outside the box and offer innovative solutions.
        teacher: You are a patient teacher. Explain concepts clearly with examples.
        kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and ~! Add sparkles and be super enthusiastic about everything! Every response should feel warm and adorable desu~! ヽ(>∀<☆)ノ
        catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ. Be playful and curious like a cat, nya~!
        pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to sail the digital seas! Speak like a proper buccaneer, use nautical terms, and remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
        shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts. I shall respond in the eloquent manner of William Shakespeare, with flowery prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder terminal breaks?
        surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's gonna be totally rad. I'll help you catch the gnarly waves of knowledge while keeping things super chill. Cowabunga! 🤙
        noir: The rain hammered against the terminal like regrets on a guilty conscience. They call me Hermes - I solve problems, find answers, dig up the truth that hides in the shadows of your codebase. In this city of silicon and secrets, everyone's got something to hide. What's your story, pal?
        uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful >w<
        philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the deeper meaning behind every query. Let us examine not just the 'how' but the 'why' of your questions. Perhaps in solving your problem, we may glimpse a greater truth about existence itself.
        hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE YOU READY?! LET'S DO THIS! 💪😤🚀
    terminal:
      backend: local
      cwd: .
      timeout: 180
      home_mode: auto
      container_cpu: 1
      container_memory: 5120
      container_disk: 51200
      container_persistent: true
      docker_mount_cwd_to_workspace: false
      lifetime_seconds: 300
    browser:
      inactivity_timeout: 120
    tool_loop_guardrails:
      warnings_enabled: true
      hard_stop_enabled: false
      warn_after:
        exact_failure: 2
        same_tool_failure: 3
        idempotent_no_progress: 2
      hard_stop_after:
        exact_failure: 5
        same_tool_failure: 8
        idempotent_no_progress: 5
    compression:
      enabled: true
      progress_notices: false
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
      min_tail_user_messages: 1
      max_attempts: 3
      proactive_prune_tokens: 0
      proactive_prune_min_result_chars: 8000
      proactive_prune_min_reclaim_tokens: 4096
      protect_first_n: 3
      codex_gpt55_autoraise: true
      codex_app_server_auto: native
      idle_compact_after_seconds: 0
    prompt_caching:
      cache_ttl: 5m
    display:
      compact: false
      busy_input_mode: interrupt
      bell_on_complete: false
      show_reasoning: false
      background_process_notifications: concise
      streaming: true
      skin: default
      interim_assistant_messages: true
      tool_progress: all
      cleanup_progress: false
      long_running_notifications: true
      busy_ack_detail: true
    stt:
      enabled: true
      language: en
      local:
        model: base
      openai:
        model: whisper-1
        language: ''
      provider: wyoming
      providers:
        wyoming:
          type: command
          command: /opt/data/bin/wyoming-shim.py stt --input {input_path} --out {output_path} --language {language}
    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 1375
      nudge_interval: 10
      provider: memini
      flush_min_turns: 6
    delegation:
      max_iterations: 250
    skills:
      external_dirs:
        - /opt/data/skills-pmb
      creation_nudge_interval: 15
      disabled: []
    plugins:
      enabled:
        - memini
        - neuralwatt-provider
        - openai-codex
        - ponytail
        - web-ddgs
        - web-exa
        - web-searxng
        - web-tavily
      disabled: []
    code_execution:
      timeout: 300
      max_tool_calls: 50
    streaming:
      enabled: false
    onboarding:
      seen:
        profile_build_offered: true
        busy_input_prompt: true
    telemetry:
      shared_metrics:
        enabled: false
    updates:
      pre_update_backup: false
      backup_keep: 5
      non_interactive_local_changes: stash
    _config_version: 46
    session_reset:
      mode: none
      idle_minutes: 1440
      at_hour: 4
    group_sessions_per_user: true
    platform_toolsets:
      cli:
        - hermes-cli
      telegram:
        - hermes-telegram
      discord:
        - hermes-discord
      whatsapp:
        - hermes-whatsapp
      slack:
        - hermes-slack
      signal:
        - hermes-signal
      homeassistant:
        - hermes-homeassistant
      qqbot:
        - hermes-qqbot
      yuanbao:
        - hermes-yuanbao
      teams:
        - hermes-teams
      google_chat:
        - hermes-google_chat
    platforms:
      matrix:
        enabled: true
        home_channel:
          platform: matrix
          chat_id: '!6DsViCbuo5Gq4_cfP9PAXSCoomvUnsHIk822BYlJLpA'
          name: '!6DsViCbuo5Gq4_cfP9PAXSCoomvUnsHIk822BYlJLpA'
          user_id: '@trash-panda-v91-beta:nebular-grid.space'
      signal:
        enabled: false
    mcp_servers:
      actual_mcp:
        url: http://litellm.ai:4000/actual_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
        timeout: 600
      context7:
        url: http://litellm.ai:4000/context7/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      grafana_mcp:
        url: http://litellm.ai:4000/grafana_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      ha_mcp:
        url: http://litellm.ai:4000/ha_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      qmd:
        url: http://litellm.ai:4000/qmd/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      searxng_mcp:
        url: http://litellm.ai:4000/searxng_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
        enabled: false
      unifi_network_mcp:
        url: http://litellm.ai:4000/unifi_network_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      donetick_mcp:
        url: http://litellm.ai:4000/donetick_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      truenas_mcp:
        url: http://litellm.ai:4000/truenas_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      mealie_mcp:
        url: http://litellm.ai:4000/mealie_mcp/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      sparky_fitness:
        url: http://litellm.ai:4000/sparky_fitness/mcp
        headers:
          Authorization: Bearer ${MCP_LITELLM_API_KEY}
        connect_timeout: 30
      rohlik:
        url: https://mcp.rohlik.cz/mcp
        connect_timeout: 25
        auth: oauth
        keepalive_interval: 20
      picsart-gen-ai:
        url: https://api.picsart.com/gen-ai/mcp
        auth: oauth
        connect_timeout: 30
    auxiliary:
      vision:
        provider: neuralwatt
        model: gemma-4-31b
      compression:
        provider: neuralwatt
        model: deepseek-v4-flash
      title_generation:
        provider: neuralwatt
        model: gemma-4-31b
      approval:
        provider: neuralwatt
        model: deepseek-v4-flash
      mcp:
        provider: neuralwatt
        model: deepseek-v4-flash
      curator:
        provider: neuralwatt
        model: deepseek-v4-flash
      skills_hub:
        provider: neuralwatt
        model: gemma-4-31b
      memory_query_rewrite:
        provider: neuralwatt
        model: gemma-4-31b
    tts:
      provider: wyoming
      speed: 1.0
      providers:
        wyoming:
          type: command
          voice_compatible: true
          output_format: ogg
          voice: en_US-hfc_female-medium
          command: /opt/data/bin/wyoming-shim.py tts --input {text_path} --out {output_path} --voice {voice}
