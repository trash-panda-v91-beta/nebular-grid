---
# Lets hermes replace a persistent volume whose source is immutable, which is
# what a NAS rename needs: the PV and its claim have to be recreated.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-storage-migrate
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-storage-migrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-storage-migrate
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: ai
