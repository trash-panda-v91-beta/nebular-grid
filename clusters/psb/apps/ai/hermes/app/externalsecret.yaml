---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-config
    creationPolicy: Owner
    template:
      # Merge keeps the data/dataFrom keys (API_SERVER_KEY, the per-app
      # fields of the 1Password hermes item) alongside the rendered ones.
      mergePolicy: Merge
      data:
        MCP_LITELLM_API_KEY: "{{ .LITELLM_API_KEY }}"
        # stored base64 in 1Password - the raw file is 32 binary bytes;
        # index access because the key contains dashes
        room-link-grant-secret: "{{ index . \"room-link-grant-secret\" | b64dec }}"
      templateFrom:
        - configMap:
            name: hermes-configmap
            items:
              - key: env
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master key
    - secretKey: PAPERS_ADMIN_TOKEN
      remoteRef:
        key: papers
        property: admin_token
    # the Matrix token lives in its own item: the hermes item is read-only to
    # the CLI, so the CL4 token could not be written back into it
    - secretKey: MATRIX_ACCESS_TOKEN
      remoteRef:
        key: hermes-matrix
        property: MATRIX_ACCESS_TOKEN
  dataFrom:
    - extract:
        key: hermes
