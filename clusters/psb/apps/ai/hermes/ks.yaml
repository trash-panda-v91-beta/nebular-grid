---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: hermes
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: system
    - name: litellm
      namespace: ai
    - name: memini
      namespace: ai
    - name: conduwuit
      namespace: matrix
  interval: 1h
  path: ./clusters/psb/apps/ai/hermes/app
  postBuild:
    substitute:
      APP: hermes
      KOPIUR_CAPACITY: 20Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
