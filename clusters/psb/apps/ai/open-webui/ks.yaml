---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: open-webui
  components:
    - ../../../../components/dragonfly
    - ../../../../components/oidc
  dependsOn:
    - name: dragonfly-operator
      namespace: database
    - name: kanidm
      namespace: security
  interval: 1h
  path: ./clusters/psb/apps/ai/open-webui/app
  postBuild:
    substitute:
      APP: open-webui
      APP_NAMESPACE: ai
      SUBDOMAIN: chat
      OIDC_CALLBACK: /oauth/oidc/callback
      OIDC_DISPLAY_NAME: Open WebUI
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
