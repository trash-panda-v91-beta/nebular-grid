---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 30m
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
            env:
              # Features
              ENABLE_LOGIN_FORM: "true"
              ENABLE_SIGNUP: "true"
              ENABLE_OLLAMA_API: "false"
              ENABLE_OPENAI_API: "true"
              OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              # Web search
              ENABLE_RAG_WEB_SEARCH: "true"
              ENABLE_SEARCH_QUERY: "true"
              RAG_WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.selfhosted.svc.cluster.local:8080/search?q=<query>
              RAG_RELEVANCE_THRESHOLD: "0.0"
              WEB_SEARCH_RESULT_COUNT: "5"
              WEB_SEARCH_CONCURRENT_REQUESTS: "10"
              ENABLE_WEBSOCKET_SUPPORT: "true"
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: redis://open-webui-dragonfly.ai.svc.cluster.local:6379
              # Kanidm OIDC SSO
              ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_PROVIDER_NAME: Kanidm
              OPENID_PROVIDER_URL: https://idm.nebular-grid.space/oauth2/openid/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.nebular-grid.space/oauth/oidc/callback
              OAUTH_SCOPES: openid email profile groups
              OAUTH_CODE_CHALLENGE_METHOD: S256
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-open-webui-oidc
                    key: client-id
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-open-webui-oidc
                    key: client-secret
              ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
              OAUTH_ROLES_CLAIM: groups
              OAUTH_ALLOWED_ROLES: adults@idm.nebular-grid.space,admins@idm.nebular-grid.space
            envFrom:
              - secretRef:
                  name: open-webui-secret
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
          open-terminal:
            image:
              repository: ghcr.io/open-webui/open-terminal
              tag: slim@sha256:b338796cb8934f5cfeb4fd5ded700331781a90cec5b031ffaf4d41cf382a691b
            workingDir: /home/user
            ports:
              - containerPort: 8000
            env:
              OPEN_TERMINAL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: OPEN_TERMINAL_API_KEY
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
    persistence:
      config:
        enabled: true
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
    route:
      app:
        hostnames:
          - chat.nebular-grid.space
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 8080
