---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 30m
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      # BBR needs BPF host routing, which hostLegacyRouting turns off. The
      # agent refuses to start otherwise: "BPF bandwidth manager's BBR setup
      # requires BPF host routing." The bandwidth manager itself stays on.
      bbr: false
    bgpControlPlane:
      enabled: true
    bpf:
      # veth, not netkit. A pod with a Multus macvlan cannot reach any
      # ClusterIP, any other pod IP, or the LAN - only addresses on its own
      # secondary network work - and netkit forbids the setting that fixes it:
      # "netkit devices cannot be used with --enable-host-legacy-routing=true".
      # onedr0p/home-ops and bjw-s-labs/home-ops both run Multus with
      # devices: bond+ on veth for exactly this reason.
      datapathMode: veth
      # The kernel's routing table inside the pod is correct - ip route get
      # shows eth0 and the pod IP - but the BPF cgroup hooks do their own
      # route lookup first and pick the wrong device when a second interface
      # is present. This makes them defer to the kernel.
      hostLegacyRouting: true
      masquerade: true
      preallocateMaps: true
    bpfClockProbe: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium
    devices: bond+
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      relay:
        enabled: true
    ipam:
      mode: kubernetes
    # Pod CIDR only. This doubles as the masquerading boundary: anything
    # outside it gets NAT'd to the node IP. Widening it to 10.0.0.0/8 to fix
    # the multi-homed ClusterIP case (cilium/cilium#43896) broke LAN access
    # from every pod - 10.1.x.x stopped being masqueraded, so packets left
    # with the pod IP as source and the LAN dropped the reply. Measured:
    # pod -> 10.1.0.1 100% loss, pod -> 8.8.8.8 fine, node -> 10.1.0.1 fine.
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: false
    loadBalancer:
      algorithm: maglev
      mode: snat
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 2
      rollOutPods: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true
