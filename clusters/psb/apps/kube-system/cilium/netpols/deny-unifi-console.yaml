---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# The UniFi console answers on .1 of every VLAN, and the cluster nodes sit on
# 10.1.10.0/24, so 10.1.10.1 is same-subnet traffic that no zone policy ever
# sees. The firewall cannot close this path - only Cilium can, because it is the
# only layer that still knows which pod a connection came from.
#
# The exemption is by namespace, not by pod label: a pod author can set any
# label they like, but a pod cannot choose its namespace. A compromised CI job
# lands in its own namespace and cannot inherit this.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-unifi-console
spec:
  description: only the three exempt namespaces may open a connection to the UniFi console
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - network
          - ai
          - home-automation
  egressDeny:
    # every VLAN gateway address the gateway answers on
    - toCIDR:
        - 10.1.0.1/32
        - 10.1.10.1/32
        - 10.1.20.1/32
        - 10.1.30.1/32
        - 10.1.40.1/32
        - 10.1.50.1/32
        - 10.1.60.1/32
        - 10.1.70.1/32
        - 10.1.80.1/32
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
