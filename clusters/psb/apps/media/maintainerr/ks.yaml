---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: maintainerr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: maintainerr
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc/envoy
  dependsOn:
    - name: kopiur
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kanidm
      namespace: security
  path: "./clusters/psb/apps/media/maintainerr/app"
  postBuild:
    substitute:
      APP: maintainerr
      APP_NAMESPACE: media
      KOPIUR_CLAIM: maintainerr
      OIDC_DISPLAY_NAME: Maintainerr
      OIDC_GROUP: admins
  prune: true
  targetNamespace: media
  timeout: 5m
  wait: false
