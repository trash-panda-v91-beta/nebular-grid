---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: immich
  components:
    - ../../../../components/dragonfly
    - ../../../../components/gpu
    - ../../../../components/postgres/pass
    - ../../../../components/postgres/patch
    - ../../../../components/oidc
  dependsOn:
    - name: dragonfly-operator
      namespace: database
    - name: intel-gpu-resource-driver
      namespace: kube-system
    - name: postgres-cluster
      namespace: database
    - name: kanidm
      namespace: security
  interval: 1h
  path: "./clusters/psb/apps/media/immich/app"
  postBuild:
    substitute:
      APP: immich
      APP_NAMESPACE: media
      SUBDOMAIN: immich
      OIDC_DISPLAY_NAME: "Immich"
      OIDC_CALLBACK: /auth/login
      OIDC_EXTRA_CALLBACKS: '["app.immich:///oauth-callback", "https://immich.nebular-grid.space/user-settings"]'
      OIDC_LEGACY_CRYPTO: "true"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 10m
  wait: false
