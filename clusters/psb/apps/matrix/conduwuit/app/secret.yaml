---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/secret.json
apiVersion: v1
kind: Secret
metadata:
  name: conduwuit-secret
type: Opaque
stringData:
  # Fail-closed: this env var takes precedence over the config file
  # (see continuwuity.org/configuration), so forcing "false" guarantees nobody can
  # register, even if conduwuit.toml is ever misconfigured. Plain static Secret:
  # a template-only ExternalSecret is rejected by the ESO webhook (needs data/
  # dataFrom), and there is no longer anything to pull from 1Password.
  CONDUWUIT_ALLOW_REGISTRATION: "false"
