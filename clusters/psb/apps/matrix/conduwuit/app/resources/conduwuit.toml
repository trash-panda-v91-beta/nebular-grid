[global]
server_name = "nebular-grid.space"
address = ["::"]
port = 8080

database_path = "/data"

allow_encryption = true
# Federation is enabled so the server can join rooms on other homeservers
# (e.g. #sable:sable.moe). Keep well-known pointing at matrix.nebular-grid.space.
allow_federation = true
# Registration is closed. The HelmRelease sets CONDUWUIT_ALLOW_REGISTRATION=false
# (env overrides the config file), and the runtime account is created via the admin
# command below. No public sign-ups.
allow_registration = false

# ponytail: single-user homeserver for hermes. Create the bot user via admin command:
# kubectl exec -n matrix statefulset/conduwuit -- /conduwuit register @hermes:nebular-grid.space
# Then get the access token from the output.

[global.well_known]
client = "https://matrix.nebular-grid.space"

[global.oauth]
compatibility_mode = "hybrid"

[global.oauth.oidc]
discovery_url = "https://idm.nebular-grid.space/oauth2/openid/conduwuit"
client_id = "conduwuit"
client_secret_file = "/etc/continuwuit/oidc_secret"
additional_scopes = ["email", "openid", "profile"]
prompt_for_localpart = false
profile_key_import_mode = "on_registration"
profile_key_map = { displayname = "name" }
