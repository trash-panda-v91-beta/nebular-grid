---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: conduwuit
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: conduwuit-secret
    creationPolicy: Owner
    template:
      data:
        # Keep registration closed. This env var takes precedence over the config
        # file (see continuwuity.org/configuration), so forcing it false guarantees
        # nobody can register, even if the toml is ever misconfigured.
        CONDUWUIT_ALLOW_REGISTRATION: "false"
