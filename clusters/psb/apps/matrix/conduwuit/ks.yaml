---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: conduwuit
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: conduwuit
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: kanidm
      namespace: security
  path: ./clusters/psb/apps/matrix/conduwuit/app
  postBuild:
    substitute:
      APP: conduwuit
      APP_NAMESPACE: matrix
      SUBDOMAIN: matrix
      OIDC_CALLBACK: /_continuwuity/oidc/complete
      OIDC_DISPLAY_NAME: Continuwuity
      OIDC_SHORT_USERNAME: "true"
  prune: true
  targetNamespace: matrix
  timeout: 5m
  wait: false
