---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Sable Next: Matrix web client, the Svelte + Rust rewrite of Sable
# (https://github.com/SableClient/sable-next).
# Stateless static site served by bundled Caddy on :8080; config.json points it
# at our conduwuit homeserver (matrix.nebular-grid.space).
# The image strips Caddy's NET_BIND_SERVICE cap and listens on :8080, so it runs
# unprivileged (runAsUser 2000) with RO rootfs + emptyDirs for Caddy's /config & /data.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sable
spec:
  chartRef:
    kind: OCIRepository
    name: sable
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      sable:
        containers:
          app:
            image:
              repository: ghcr.io/sableclient/sable-next
              tag: dev@sha256:33ed7971c4f92989d61ae0f063d4e121f9276b07c0aa5e69d8a164462122e4fd
            env:
              TZ: Europe/Prague
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
    persistence:
      config-json:
        type: configMap
        name: sable-configmap
        globalMounts:
          - path: /app/config.json
            subPath: config.json
            readOnly: true
      caddy-config:
        type: emptyDir
        globalMounts:
          - path: /config
      caddy-data:
        type: emptyDir
        globalMounts:
          - path: /data
    route:
      app:
        annotations:
          external-dns.kubernetes.io/cloudflare-proxied: "false"
        hostnames:
          - "sable.nebular-grid.space"
        parentRefs:
          - name: envoy-internal-public-dns
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: sable
        ports:
          http:
            port: 8080
