---
# Unauthenticated /api route for API clients (helmarr, LunaSea, etc).
# The oidc/envoy component's SecurityPolicy only targetRefs the
# app-template-generated route named "sabnzbd", so this separate route is never
# OIDC-attached. SABnzbd gates /api with its own API key. Longest-prefix match
# routes /api/* here and everything else to the OIDC-protected route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd-api
  namespace: downloads
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: envoy-internal-public-dns
      namespace: network
  hostnames:
    - sabnzbd.nebular-grid.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: sabnzbd
          port: 8080
