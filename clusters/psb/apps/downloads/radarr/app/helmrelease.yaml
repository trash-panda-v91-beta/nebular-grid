---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 30m
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.2.10888@sha256:69ea515df6e2a3ea1490cfa127ffaaf9597a9db84fffa2fa150a6fae98fe04cb
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: api_key
              RADARR__AUTH__METHOD: Oidc
              RADARR__AUTH__REQUIRED: Enabled
              # Radarr matches a single identity on verified email or sub.
              RADARR__AUTH__OIDCAUTHORITY: https://idm.nebular-grid.space/oauth2/openid/radarr
              RADARR__AUTH__OIDCUSERIDENTIFIER: petr@idm.nebular-grid.space
              RADARR__AUTH__OIDCSCOPES: openid email profile
              RADARR__AUTH__OIDCCLIENTID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-radarr-oidc
                    key: client-id
              RADARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-radarr-oidc
                    key: client-secret
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 7878
              # Trust envoy's X-Forwarded-Proto so the OIDC redirect URI is built as
              # https; without it the callback is http and Kanidm rejects it.
              RADARR__SERVER__TRUSTEDNETWORKS: 10.244.0.0/16
              RADARR__UPDATE__BRANCH: develop
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 384Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: radarr-config
      media:
        type: nfs
        path: /mnt/tank/media
        server: asc.sto.bar.internal
        globalMounts:
          - path: /data/nas-media
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
    route:
      app:
        annotations:
          external-dns.kubernetes.io/cloudflare-proxied: "false"
        hostnames:
          - radarr.nebular-grid.space
        parentRefs:
          - name: envoy-internal
            namespace: network
