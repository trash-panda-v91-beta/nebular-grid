---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: bazarr
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler/nas-nfs-scaler
    - ../../../../components/oidc/envoy
  dependsOn:
    - name: kopiur
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kanidm
      namespace: security
  interval: 1h
  path: "./clusters/psb/apps/downloads/bazarr/app"
  postBuild:
    substitute:
      APP: bazarr
      APP_NAMESPACE: downloads
      KOPIUR_CLAIM: bazarr-config
      OIDC_DISPLAY_NAME: Bazarr
      OIDC_GROUP: admins
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
  timeout: 5m
  wait: false
