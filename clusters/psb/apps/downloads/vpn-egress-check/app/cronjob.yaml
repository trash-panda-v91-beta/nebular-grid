---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vpn-egress-check
spec:
  schedule: "12 */1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "multus-vpn",
                "namespace": "network",
                "ips": ["10.1.50.13/24"]
              }]
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              command:
                - /bin/sh
                - -c
                - |-
                  # The pod holds two paths out: the macvlan on the VPN VLAN, and
                  # the cluster interface. They must never agree - if they do,
                  # the tunnel is not carrying the traffic and we are leaking.
                  # Both probes have to return an address, or the run proves nothing.
                  vpn=$(curl -s --max-time 25 https://icanhazip.com) || { echo "no answer through the tunnel"; exit 1; }
                  cluster=$(curl -s --max-time 25 --interface eth0 https://icanhazip.com) || cluster=""
                  echo "via tunnel: [$vpn] | via cluster: [$cluster]"
                  [ -n "$vpn" ] || exit 1
                  [ -n "$cluster" ] || { echo "cannot calibrate - the cluster path gave nothing"; exit 1; }
                  [ "$vpn" != "$cluster" ] || { echo "LEAK - both paths give $vpn"; exit 1; }
