---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 30m
  values:
    controllers:
      qui:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.35.0@sha256:a5b2f5faf6388cce257137c88e4b189458fd799cf9119ed476c980e5a69341b2
            env:
              TZ: Europe/Prague
              QUI__HOST: 0.0.0.0
              QUI__PORT: &port 7476
              # qui only hides its local login form when OIDC is on, so this is
              # what leaves Kanidm as the only way in.
              QUI__OIDC_ENABLED: "true"
              QUI__OIDC_ISSUER: https://idm.nebular-grid.space/oauth2/openid/qui
              QUI__OIDC_REDIRECT_URL: https://qui.nebular-grid.space/api/auth/oidc/callback
              QUI__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
              QUI__OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-qui-oidc
                    key: client-id
              QUI__OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-qui-oidc
                    key: client-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: qui
        advancedMounts:
          qui:
            app:
              - path: /config
      downloads:
        type: nfs
        path: /mnt/tank/media
        server: asc.sto.bar.internal
        globalMounts:
          - path: /data/nas-media
      tmp:
        type: emptyDir
        advancedMounts:
          qui:
            app:
              - path: /tmp
    route:
      app:
        hostnames:
          - qui.nebular-grid.space
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
