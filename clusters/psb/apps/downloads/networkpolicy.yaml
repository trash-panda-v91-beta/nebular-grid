---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Namespace-wide default deny for ingress. Everything in here is reached either
# through a gateway or by a sibling pod, so nothing else in the cluster has any
# business connecting to it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: downloads-ingress
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: envoy-internal
            k8s:io.kubernetes.pod.namespace: network
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: envoy-internal-public-dns
            k8s:io.kubernetes.pod.namespace: network
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: downloads
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seerr
            k8s:io.kubernetes.pod.namespace: media
        - matchLabels:
            app.kubernetes.io/name: maintainerr
            k8s:io.kubernetes.pod.namespace: media
    - # kubelet probes come from the node, not from a pod
      fromEntities:
        - host
