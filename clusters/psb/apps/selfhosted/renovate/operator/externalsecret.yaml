---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Tokens for renovate. The operator injects the referenced secret into every job
# pod it spawns, under the names renovate itself reads. The github.com PAT is
# read-only on purpose: it only lifts the anonymous API rate limit for
# github-hosted dependencies and changelogs, which renovate skips without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-secret
    creationPolicy: Owner
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: renovate
        property: token
    - secretKey: RENOVATE_GITHUB_COM_TOKEN
      remoteRef:
        key: renovate
        property: github-com-token
