---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Renovate bot token. The `renovate` user is a repo collaborator, so a leaked
# token can only touch the repos it was granted, not the instance.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: renovate
        property: token
