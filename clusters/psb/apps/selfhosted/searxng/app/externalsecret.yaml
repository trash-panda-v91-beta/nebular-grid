---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: searxng-secret
    creationPolicy: Owner
    # settings.yml lives here, not in a ConfigMap: it carries the engine API
    # keys. Same pattern as the postgres and paperless ExternalSecrets.
    template:
      engineVersion: v2
      data:
        settings.yml: |
          use_default_settings: true
          server:
            limiter: true
            image_proxy: true
            method: GET
            public_instance: false
          search:
            autocomplete: duckduckgo
            favicon_resolver: duckduckgo
            default_lang: en
            safe_search: 0
            formats:
              - html
              - json
            # The defaults park a failed engine for a day, so one CAPTCHA blanks the
            # instance until the next restart. Shorter bans mean an engine comes
            # back on its own.
            ban_time_on_fail: 5
            max_ban_time_on_fail: 300
            suspended_times:
              SearxEngineAccessDenied: 600
              SearxEngineCaptcha: 600
              SearxEngineTooManyRequests: 300
              cf_SearxEngineCaptcha: 3600
              cf_SearxEngineAccessDenied: 600
              recaptcha_SearxEngineCaptcha: 3600
          general:
            instance_name: Nebular Grid Search

          # Engine set for a residential IP. Upstream defaults favour Brave,
          # DuckDuckGo and Google CSE - exactly the engines that CAPTCHA or 429 a
          # home connection, leaving the instance with zero results. From a home IP
          # the reliable engines are the ones with public APIs and the ones that
          # tolerate residential clients: Bing, Yahoo, Seznam, Wikipedia, GitHub,
          # Docker Hub, the Arch wiki. Reverse of upstream on purpose.

          engines:
            # API-backed engines first. These are interfaces meant to be called -
            # no scraping, no CAPTCHAs, no rate-limit games - and their relevance is
            # in a different class from anything we can scrape. `weight` puts them
            # above the scraping engines so they lead. Keys come from the
            # searxng-secret env, never from this file.
            - name: brave
              engine: braveapi
              shortcut: br
              api_key: "{{ .BRAVE_API_KEY }}"
              require_api_key: true
              disabled: false
              categories: [general]
              weight: 2.0
              use_official_api: true
            - name: exa
              engine: exaapi
              shortcut: ex
              api_key: "{{ .EXA_API_KEY }}"
              require_api_key: true
              disabled: false
              categories: [general]
              weight: 2.0
              use_official_api: true
            # Scraping engines below. API-backed or residential-friendly - these are
            # what answer when the API engines have no quota left.
            # `categories` matters more than `disabled`: a plain search runs only the
            # `general` engines, and the API-backed ones default to `it`/`science`,
            # so without this they are enabled and never asked. With Seznam as the
            # only general engine we were getting one source per search.
            - name: bing
              disabled: false
              categories: [general]
            - name: yahoo
              disabled: false
              categories: [general]
            - name: seznam
              disabled: false
              categories: [general]
            - name: wikipedia
              disabled: false
              categories: [general]
            - name: wikidata
              disabled: false
              categories: [general]
            - name: github
              disabled: false
              categories: [general]
            - name: docker hub
              disabled: false
              # Name matcher, not a relevance engine: it matches the query against
              # image names and can fill the top of a general search with unrelated
              # repos. Useful when you ask for an image, not for a general query.
              categories: [it]
            - name: archwiki
              disabled: false
              categories: [general]
            - name: stackoverflow
              disabled: false
              categories: [general]
            - name: google scholar
              disabled: false
              categories: [general, science]
            - name: arxiv
              disabled: false
              categories: [general, science]
            - name: pypi
              disabled: false
              categories: [general, it]
            - name: npm
              disabled: false
              categories: [general, it]
            - name: mdn
              disabled: false
              categories: [general, it]
            # Consumer search pages that CAPTCHA a home connection. Off so they
            # stop burning query slots and blanking the result set.
            - name: duckduckgo
              disabled: true
            - name: brave
              disabled: true
            - name: startpage
              disabled: true
            - name: google
              disabled: true
            - name: google cse
              disabled: true
            - name: qwant
              disabled: true

          ui:
            default_theme: simple
            infinite_scroll: true
            query_in_title: true
            static_use_hash: true
            theme_args:
              simple_style: auto
          enabled_plugins:
            - Basic Calculator
            - Hash plugin
            - Open Access DOI rewrite
            - Self Informations
            - Tracker URL remover
            - Unit converter plugin
          # Result ranking: lift primary sources and docs, push content farms and
          # link-shorteners down. Agents read the top results, so ordering matters
          # more than it does for a human scrolling a page.
          hostnames:
            high_priority:
              - (.*)\/blog\/(.*)
              - (.*\.)?wikipedia.org$
              - (.*\.)?github.com$
              - (.*\.)?gitlab.com$
              - (.*\.)?reddit.com$
              - (.*\.)?archlinux.org$
              - (.*\.)?stackoverflow.com$
              - (.*\.)?askubuntu.com$
              - (.*\.)?superuser.com$
              - (.*\.)?stackexchange.com$
              - (.*\.)?docs.rs$
              - (.*\.)?readthedocs.io$
              - (.*\.)?developer.mozilla.org$
              - (.*\.)?kubernetes.io$
              - (.*\.)?grafana.com$
              - (.*\.)?prometheus.io$
              - (.*\.)?terraform.io$
              - (.*\.)?python.org$
              - (.*\.)?postgresql.org$
              - (.*\.)?kernel.org$
              - (.*\.)?ietf.org$
              - (.*\.)?rfc-editor.org$
              - (.*\.)?w3.org$
              - (.*\.)?whatwg.org$
              - (.*\.)?apple.com$
              - (.*\.)?ui.com$
              - (.*\.)?ubnt.com$
            low_priority:
              - (.*\.)?pinterest\..*$
              - (.*\.)?quora.com$
              - (.*\.)?medium.com$
              - (.*\.)?facebook.com$
              - (.*\.)?instagram.com$
              - (.*\.)?tiktok.com$
              - (.*\.)?twitter.com$
              - (.*\.)?x.com$
              - (.*\.)?linkedin.com$
              - bit\.ly$
              - tinyurl\.com$
              - (.*\.)?wixsite.com$
              - (.*\.)?blogspot\..*$
              - (.*\.)?substack.com$
              - (.*\.)?forbes.com$
              - (.*\.)?cnet.com$
              - (.*\.)?techradar.com$
        secret_key: "{{ .secret_key }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: searxng
        property: secret key
    # Read straight from the Brave item - no copy sitting in searxng.
    - secretKey: BRAVE_API_KEY
      remoteRef:
        key: Brave
        property: api token
    # The Exa key already exists on the hermes item.
    - secretKey: EXA_API_KEY
      remoteRef:
        key: hermes
        property: EXA_API_KEY
