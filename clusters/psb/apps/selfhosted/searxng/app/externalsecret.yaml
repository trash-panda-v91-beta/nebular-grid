---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: searxng-secret
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: searxng
        property: secret key
    # Read straight from the Brave item - no copy sitting in searxng.
    - secretKey: BRAVE_API_KEY
      remoteRef:
        key: Brave
        property: api token
    # The Exa key already exists on the hermes item.
    - secretKey: EXA_API_KEY
      remoteRef:
        key: hermes
        property: EXA_API_KEY
