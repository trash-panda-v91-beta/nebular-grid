---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  chartRef:
    kind: OCIRepository
    name: searxng
  interval: 30m
  values:
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 977
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 977
            runAsUser: 977
        containers:
          app:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.11.5-3e95f6cd2@sha256:ffad724acd87b8dd312328d18da88ddd42e5c4b1d23231594662620053c13cae
            env:
              SEARXNG_BASE_URL: https://search.nebular-grid.space
              SEARXNG_PORT: &httpPort 8080
              # Backing store for the rate limiter (Dragonfly, deployed via the
              # dragonfly component). bjw-s pattern.
              SEARXNG_VALKEY_URL: redis://searxng-dragonfly.selfhosted.svc.cluster.local:6379/0
              SEARXNG_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: searxng-secret
                    key: secret_key
            # settings.yml is rendered by the ExternalSecret template with the
            # engine API keys inlined, so no env expansion is needed here.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /stats
                    port: *httpPort
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /stats
                    port: *httpPort
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - SETGID
                  - SETUID
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi

    service:
      app:
        ports:
          http:
            port: *httpPort

    persistence:
      settings:
        type: secret
        name: searxng-secret
        globalMounts:
          - path: /etc/searxng/settings.yml
            subPath: settings.yml
            readOnly: true
      config:
        type: configMap
        name: searxng-config
        globalMounts:
          - path: /etc/searxng/limiter.toml
            subPath: limiter.toml
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        annotations:
          external-dns.kubernetes.io/cloudflare-proxied: "false"
        hostnames:
          - search.nebular-grid.space
        parentRefs:
          - name: envoy-internal
            namespace: network
