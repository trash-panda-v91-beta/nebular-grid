---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
data:
  settings.yml: |-
    use_default_settings: true
    server:
      limiter: true
      image_proxy: true
      method: GET
      public_instance: false
    search:
      autocomplete: duckduckgo
      favicon_resolver: duckduckgo
      formats:
        - html
        - json
    general:
      instance_name: Nebular Grid Search
    ui:
      default_theme: simple
      infinite_scroll: true
      query_in_title: true
      static_use_hash: true
      theme_args:
        simple_style: auto
    enabled_plugins:
      - Basic Calculator
      - Hash plugin
      - Open Access DOI rewrite
      - Self Informations
      - Tracker URL remover
      - Unit converter plugin
    hostnames:
      high_priority:
        - (.*)\/blog\/(.*)
        - (.*\.)?wikipedia.org$
        - (.*\.)?github.com$
        - (.*\.)?reddit.com$
        - (.*\.)?docker.com$
        - (.*\.)?archlinux.org$
        - (.*\.)?stackoverflow.com$
        - (.*\.)?askubuntu.com$
        - (.*\.)?superuser.com$
    # Engine set: keep all searxng default engines (like bjw-s home-ops). This
    # instance runs on a home IP, so the engine blocks we saw (Brave "too many
    # requests", Startpage "CAPTCHA", Qwant/Yep "access denied") are behavioral
    # rate-limit/CAPTCHA windows, not permanent IP bans - and they are time-
    # varying (Bing/Yahoo answered in some probes). The server limiter
    # (limiter: true) throttles our own probing so engines keep seeing one
    # polite client and stay in their working window. No engines disabled.
  limiter.toml: |-
    [botdetection]
    # Prefix defines leading bits compared to group client addresses.
    ipv4_prefix = 32
    ipv6_prefix = 48

    # Client IP is extracted from X-Forwarded-For / X-Real-IP when the request
    # comes from these trusted proxies (our envoy gateway + node CIDRs).
    trusted_proxies = ['127.0.0.0/8', '10.244.0.0/16', '10.96.0.0/12']

    [botdetection.ip_limit]
    filter_link_local = true
    link_token = false

    [botdetection.ip_lists]
    block_ip = []

    # Internal cluster traffic (Hermes, MCP, OpenWebUI) bypasses the limiter —
    # a private single-user instance's only legit clients are in-cluster pods.
    # Keeps the instance well-behaved for upstream engines without ever
    # rate-limiting our own agent.
    pass_ip = [
      '10.244.0.0/16', # pod CIDR
      '10.96.0.0/12',  # service CIDR
    ]
    pass_searxng_org = false
