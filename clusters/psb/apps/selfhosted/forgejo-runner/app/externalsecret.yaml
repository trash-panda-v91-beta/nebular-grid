---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Forgejo runner registration token. It is long lived on purpose: the runner
# registers itself on first start and only re-registers if /data is lost, so
# nobody should have to run `forgejo-runner register` by hand. Reset the token in
# the Forgejo admin if it ever leaks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
  data:
    - secretKey: registration-token
      remoteRef:
        key: forgejo-runner
        property: registration-token
