---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Read-only registry credential, rendered straight into a dockerconfigjson so it
# can be used as an imagePullSecret. The Forgejo user `registry-reader` holds
# read:package only, and the package stays private.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forge-registry
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forge-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"git.nebular-grid.space":{"username":"registry-reader","password":"{{ .token }}","auth":"{{ printf "registry-reader:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: forgejo-registry
        property: token
