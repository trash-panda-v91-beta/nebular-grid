---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
# Daily basket import into Sparky foods, running the image published to the
# forge registry. Skips silently when Sparky is not ready; exits non-zero only on
# real breakage, so Alertmanager stays quiet for restarts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rohlik-import
spec:
  schedule: "0 5 * * *"
  timeZone: Europe/Prague
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: forge-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: import
              image: git.nebular-grid.space/nebular-grid/rohlik-import:dev
              imagePullPolicy: Always
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: HOME
                  value: /tmp
                - name: SPARKY_URL
                  value: http://sparkyfitness.selfhosted.svc.cluster.local:3010
                - name: SPARKY_HEALTH_WAIT
                  value: "600"
                - name: DRY_RUN
                  value: "0"
                - name: ROHLIK_USER
                  valueFrom:
                    secretKeyRef:
                      name: rohlik-import-secret
                      key: ROHLIK_USER
                - name: ROHLIK_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rohlik-import-secret
                      key: ROHLIK_PASSWORD
                - name: SPARKY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rohlik-import-secret
                      key: SPARKY_API_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
