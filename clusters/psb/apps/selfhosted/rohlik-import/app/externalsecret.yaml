---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Rohlik account: a 1Password item `Rohlik` with `username` and `password`.
# Unofficial API, so these are account credentials - scope them to this secret only.
# The Sparky key is reused from the existing `hermes` item rather than duplicated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rohlik-import
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rohlik-import-secret
    creationPolicy: Owner
  data:
    - secretKey: ROHLIK_USER
      remoteRef:
        key: Rohlik
        property: username
    - secretKey: ROHLIK_PASSWORD
      remoteRef:
        key: Rohlik
        property: password
    - secretKey: SPARKY_API_KEY
      remoteRef:
        key: hermes
        property: SPARKY_FITNESS_API_KEY
