---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feeds-basic-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: feeds-basic-auth
    creationPolicy: Owner
    template:
      data:
        ".htpasswd": "{{ .feeds_htpasswd }}"
  dataFrom:
    - extract:
        key: Feeds Basic Auth
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9-]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "feeds_$1"
