---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: feeds
spec:
  chartRef:
    kind: OCIRepository
    name: feeds
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      feeds:
        containers:
          app:
            image:
              repository: docker.io/library/nginx
              tag: 1.31-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
            securityContext:
              runAsUser: 101
              runAsGroup: 101
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    configMaps:
      feeds:
        data:
          nginx.conf: |
            worker_processes 1;
            pid /tmp/nginx.pid;
            error_log /dev/stderr warn;
            events {
              worker_connections 256;
            }
            http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              access_log /dev/stdout;
              client_body_temp_path /tmp/client_body;
              proxy_temp_path /tmp/proxy;
              fastcgi_temp_path /tmp/fastcgi;
              uwsgi_temp_path /tmp/uwsgi;
              scgi_temp_path /tmp/scgi;
              types {
                application/xml xml;
                application/atom+xml atom;
                application/rss+xml rss;
              }
              server {
                listen 8080;
                server_name _;
                root /srv/feeds;
                location = /healthz {
                  access_log off;
                  return 200 "ok\n";
                }
                location = / {
                  default_type text/plain;
                  return 200 "feeds\n";
                }
                location / {
                  autoindex off;
                  add_header Cache-Control "no-store";
                  dav_methods PUT DELETE;
                  create_full_put_path on;
                  client_max_body_size 8m;
                  limit_except GET HEAD {
                    allow 10.0.0.0/8;
                    allow 172.16.0.0/12;
                    allow 192.168.0.0/16;
                    deny all;
                  }
                }
              }
            }
    persistence:
      config:
        type: configMap
        identifier: feeds
        advancedMounts:
          feeds:
            app:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
      data:
        type: persistentVolumeClaim
        size: 1Gi
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        advancedMounts:
          feeds:
            app:
              - path: /srv/feeds
    service:
      app:
        controller: feeds
        ports:
          http:
            port: 8080
            protocol: HTTP
    route:
      app:
        hostnames:
          - feeds.nebular-grid.space
        parentRefs:
          - name: envoy-internal
            namespace: network
