---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Two 1Password items:
# - `papers` with `llm_key` (LiteLLM API key for scoring) and `seerr_key`
#   (Seerr API key for trending and the /add route)
# - `papers-basic-auth` with a `users` property holding one htpasswd line,
#   SHA only (`htpasswd -s`). Reeder subscribes with
#   https://user:pass@papers.nebular-grid.space/daily.xml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: papers
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: papers-secret
    creationPolicy: Owner
  data:
    - secretKey: llm_key
      remoteRef:
        key: papers
        property: llm_key
    - secretKey: seerr_key
      remoteRef:
        key: papers
        property: seerr_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: papers-basic-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: papers-basic-auth-secret
    creationPolicy: Owner
  data:
    - secretKey: .htpasswd
      remoteRef:
        key: papers-basic-auth
        property: users
