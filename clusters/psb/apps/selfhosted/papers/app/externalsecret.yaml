---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# One 1Password item `papers` with two fields:
# - `seerr_key`: Seerr API key for trending and the /add route
# - `htpasswd`: one htpasswd line, SHA only (`htpasswd -s`). Reeder subscribes
#   with https://user:pass@papers.nebular-grid.space/daily.xml
# The scoring key is NOT stored here: LiteLLM runs DB-less and only accepts
# its master key, so llm_key syncs straight from the litellm item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: papers
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: papers-secret
    creationPolicy: Owner
  data:
    - secretKey: llm_key
      remoteRef:
        key: litellm
        property: master key
    - secretKey: seerr_key
      remoteRef:
        key: papers
        property: seerr_key
    - secretKey: .htpasswd
      remoteRef:
        key: papers
        property: htpasswd
