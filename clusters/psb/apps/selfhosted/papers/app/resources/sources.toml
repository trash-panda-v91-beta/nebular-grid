# Ranking is the product: tune weights and keywords here, reloader restarts the
# pod when the ConfigMap changes.
keep_per_day = 10

[rank]
exclude = ["giveaway", "sponsored", "webinar", "crypto"]
require_any = []

[[sources]]
name = "lwn"
kind = "feed"
url = "https://lwn.net/headlines/rss"
weight = 8

[[sources]]
name = "hn"
kind = "feed"
url = "https://hnrss.org/frontpage"
weight = 6
max_per_fetch = 40

[[sources]]
name = "kubernetes-blog"
kind = "feed"
url = "https://kubernetes.io/feed.xml"
weight = 9

[[sources]]
name = "seerr-trending"
kind = "seerr"
url = "http://seerr.media.svc.cluster.local"
weight = 7
max_per_fetch = 10
