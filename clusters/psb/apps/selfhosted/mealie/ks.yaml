---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: mealie
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/pass
    - ../../../../components/postgres/patch
    - ../../../../components/oidc
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: postgres-cluster
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur
      namespace: system
    - name: kanidm
      namespace: security
  interval: 1h
  path: ./clusters/psb/apps/selfhosted/mealie/app
  postBuild:
    substitute:
      APP: mealie
      APP_NAMESPACE: selfhosted
      KOPIUR_CLAIM: mealie-data
      KOPIUR_CAPACITY: 5Gi
      OIDC_DISPLAY_NAME: Mealie
      OIDC_CALLBACK: /login
      OIDC_REDIRECTS: "[\"https://mealie.nebular-grid.space/login\"]"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
