---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  interval: 30m
  values:
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
    image:
      rootless: true
      # chart appVersion is stale, pin the image the chart was released against
      tag: 17.0.1-rootless
    persistence:
      create: false
      claimName: forgejo
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    gitea:
      admin:
        # no local admin account, login is kanidm only and the admins group grants site admin
        username: ""
      config:
        database:
          DB_TYPE: postgres
          HOST: postgres-rw.database.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
        server:
          ROOT_URL: https://git.nebular-grid.space
          DOMAIN: git.nebular-grid.space
          SSH_DOMAIN: git.nebular-grid.space
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
          DEFAULT_ENABLE_TIMETRACKING: false
          # kanidm is the only way in
          ENABLE_INTERNAL_SIGNIN: false
        oauth2_client:
          # a login nobody has created an account for is refused
          ENABLE_AUTO_REGISTRATION: false
        repository:
          DEFAULT_BRANCH: main
        cron.archive_cleanup:
          ENABLED: true
          RUN_AT_START: true
          SCHEDULE: "@every 1h"
          OLDER_THAN: 2h
      oauth:
        - name: kanidm
          provider: openidConnect
          existingSecret: kanidm-forgejo-oidc
          autoDiscoverUrl: https://idm.nebular-grid.space/oauth2/openid/forgejo/.well-known/openid-configuration
          groupClaimName: groups
          adminGroup: admins@idm.nebular-grid.space
          scopes: openid email profile groups
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres
              key: password
    service:
      ssh:
        port: 22
    tcpRoute:
      enabled: false
    httpRoute:
      enabled: true
      hostnames:
        - git.nebular-grid.space
      parentRefs:
        - name: envoy-internal
          namespace: network
