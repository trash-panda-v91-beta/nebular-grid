---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  interval: 30m
  values:
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
    image:
      rootless: true
      # chart appVersion is stale, pin the image the chart was released against
      tag: 17.0.1-rootless
    persistence:
      create: false
      claimName: forgejo
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    gitea:
      admin:
        # no local admin account, login is kanidm only and the admins group grants site admin
        username: ""
      config:
        database:
          DB_TYPE: postgres
          HOST: postgres-rw.database.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
        server:
          ROOT_URL: https://git.nebular-grid.space
          DOMAIN: git.nebular-grid.space
          SSH_DOMAIN: git.nebular-grid.space
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
          DEFAULT_ENABLE_TIMETRACKING: false
          # kanidm is the only way in
          ENABLE_INTERNAL_SIGNIN: false
        oauth2_client:
          # Kanidm is the account source: the first login creates the account,
          # because there is no local password to sign in with and link by hand.
          # Internal sign-in stays disabled, so this cannot be reached by password.
          ENABLE_AUTO_REGISTRATION: true
          # match an existing account by email instead of showing the link-account
          # form, which cannot be completed without a local password
          ACCOUNT_LINKING: auto
        session:
          # memory sessions die with the pod, which breaks the oauth handshake
          # halfway: the browser returns with a session id the new process has
          # never seen, and goth answers ErrNoSession before the token exchange.
          PROVIDER: file
          PROVIDER_CONFIG: /data/gitea/sessions
          # plain `session` collides with anything else on the parent domain, and
          # a stale copy shadows the fresh one because Go takes the first match.
          COOKIE_NAME: forgejo_session
        repository:
          DEFAULT_BRANCH: main
        cron.archive_cleanup:
          ENABLED: true
          RUN_AT_START: true
          SCHEDULE: "@every 1h"
          OLDER_THAN: 2h
      oauth:
        - name: kanidm
          provider: openidConnect
          existingSecret: kanidm-forgejo-oidc
          autoDiscoverUrl: https://idm.nebular-grid.space/oauth2/openid/forgejo/.well-known/openid-configuration
          groupClaimName: groups
          adminGroup: admins@idm.nebular-grid.space
          scopes: openid email profile groups
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres
              key: password
    # Git over HTTPS only. The tcpRoute went with the gateway's ssh
    # listener - see the note in the internal gateway config.
    httpRoute:
      enabled: true
      annotations:
        external-dns.kubernetes.io/cloudflare-proxied: "false"
      hostnames:
        - git.nebular-grid.space
      parentRefs:
        - name: envoy-internal
          namespace: network
