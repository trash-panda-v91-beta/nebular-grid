---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Donetick: self-hosted task & chore management app. Single container, SQLite in
# a PVC. Config is fully env-driven (DT_* vars) per config/selfhosted.env; no
# external DB. DT_JWT_SECRET is the only required secret.
# Repo: https://github.com/donetick/donetick
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: donetick
spec:
  chartRef:
    kind: OCIRepository
    name: donetick
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        # Donetick's alpine image runs as root (uid 0; the Dockerfile does not
        # drop privileges). fsGroup 2000 lets k8s own the ceph-block PVC to
        # gid 2000 at mount time so SQLite writes in /donetick-data succeed.
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      donetick:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/donetick/donetick
              tag: v0.1.76@sha256:2f32646ef4e613f44066163646f53c02d6d5b728b31abe47dfd111b3dfd53643
            env:
              DT_ENV: selfhosted
              TZ: Europe/Prague
              DT_SERVER_PORT: &httpPort 2021
              DT_SERVER_SERVE_FRONTEND: "true"
              DT_DATABASE_TYPE: sqlite
              DT_DATABASE_MIGRATION: "true"
              DT_SQLITE_PATH: /donetick-data/donetick.db
              DT_JWT_SESSION_TIME: 168h
              DT_JWT_MAX_REFRESH: 1440h
              DT_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: donetick
                    key: jwt_secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *httpPort
                    path: /health
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *httpPort
                    path: /health
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: donetick
        ports:
          http:
            port: *httpPort
            protocol: HTTP
    persistence:
      data:
        existingClaim: donetick-data
        advancedMounts:
          donetick:
            app:
              - path: /donetick-data
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        hostnames:
          - donetick.nebular-grid.space
        parentRefs:
          - name: envoy-internal-public-dns
            namespace: network
