---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Syncs the JWT signing secret from 1Password into a Secret the donetick pod
# reads via DT_JWT_SECRET. Create a 1Password item named `donetick` with a
# `jwt_secret` text field (min 32 chars - `openssl rand -base64 32`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: donetick
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: donetick
        property: jwt_secret
