---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: donetick
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: donetick
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur
      namespace: system
    - name: kanidm
      namespace: security
  interval: 1h
  path: ./clusters/psb/apps/selfhosted/donetick/app
  postBuild:
    substitute:
      APP: donetick
      APP_NAMESPACE: selfhosted
      KOPIUR_CLAIM: donetick-data
      KOPIUR_CAPACITY: 1Gi
      OIDC_DISPLAY_NAME: Donetick
      OIDC_CALLBACK: /auth/oauth2
      OIDC_SCOPE_MAPS: "{\"children\": [], \"admins\": []}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
