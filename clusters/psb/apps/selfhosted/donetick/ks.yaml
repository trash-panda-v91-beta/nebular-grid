---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: donetick
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: donetick
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur
      namespace: system
  interval: 1h
  path: ./clusters/psb/apps/selfhosted/donetick/app
  postBuild:
    substitute:
      APP: donetick
      KOPIUR_CLAIM: donetick-data
      KOPIUR_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
