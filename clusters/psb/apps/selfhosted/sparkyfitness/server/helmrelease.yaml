---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sparkyfitness
spec:
  chartRef:
    kind: OCIRepository
    name: sparkyfitness
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      sparkyfitness:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        containers:
          app:
            image:
              repository: ghcr.io/codewithcj/sparkyfitness-server
              tag: v1.7.2@sha256:a3562bb89cf0c7f8394bc2728776d9ba42327aaabf831ef35f00e0fe1ee47a93
            env:
              SPARKY_FITNESS_DB_NAME: sparkyfitness
              SPARKY_FITNESS_DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgres
                    key: username
              SPARKY_FITNESS_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgres
                    key: password
              SPARKY_FITNESS_APP_DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgres
                    key: username
              SPARKY_FITNESS_APP_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgres
                    key: password
              SPARKY_FITNESS_DB_HOST: postgres-rw.database.svc.cluster.local
              SPARKY_FITNESS_FRONTEND_URL: https://fitness.nebular-grid.space
              SPARKY_FITNESS_DISABLE_SIGNUP: "false"
              NODE_ENV: production
              SPARKY_FITNESS_ADMIN_EMAIL: petr@nebular-grid.space
              SPARKY_FITNESS_CUSTOM_UPLOADS_DIRECTORY: /app/SparkyFitnessServer/uploads
              SPARKY_FITNESS_OIDC_AUTH_ENABLED: "true"
              SPARKY_FITNESS_OIDC_PROVIDER_SLUG: kanidm
              SPARKY_FITNESS_OIDC_PROVIDER_NAME: Kanidm
              SPARKY_FITNESS_OIDC_ISSUER_URL: https://idm.nebular-grid.space/oauth2/openid/sparkyfitness
              SPARKY_FITNESS_OIDC_SCOPE: openid profile email
              SPARKY_FITNESS_OIDC_DOMAIN: fitness.nebular-grid.space
              SPARKY_FITNESS_OIDC_AUTO_REGISTER: "true"
              SPARKY_FITNESS_OIDC_TOKEN_AUTH_METHOD: client_secret_basic
              SPARKY_FITNESS_OIDC_ID_TOKEN_SIGNED_ALG: ES256
              SPARKY_FITNESS_OIDC_USERINFO_SIGNED_ALG: ES256
              SPARKY_FITNESS_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-sparkyfitness-oidc
                    key: client-id
              SPARKY_FITNESS_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-sparkyfitness-oidc
                    key: client-secret
            envFrom:
              - secretRef:
                  name: sparkyfitness-secrets
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 20m
                memory: 384Mi
              limits:
                memory: 768Mi
    service:
      app:
        controller: sparkyfitness
        ports:
          http:
            port: 3010
    persistence:
      uploads:
        existingClaim: sparkyfitness-uploads
        advancedMounts:
          sparkyfitness:
            app:
              - path: /app/SparkyFitnessServer/uploads
      tmp:
        type: emptyDir
        advancedMounts:
          sparkyfitness:
            app:
              - path: /tmp
                subPath: tmp
              - path: /app/SparkyFitnessServer/temp_uploads
                subPath: temp_uploads
