---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sparkyfitness
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: sparkyfitness
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/pass
    - ../../../../components/postgres/patch
    - ../../../../components/oidc
  dependsOn:
    - name: postgres-cluster
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur
      namespace: system
    - name: kanidm
      namespace: security
  interval: 1h
  path: "./clusters/psb/apps/selfhosted/sparkyfitness/server"
  postBuild:
    substitute:
      APP: sparkyfitness
      APP_NAMESPACE: selfhosted
      SUBDOMAIN: fitness
      KOPIUR_CLAIM: sparkyfitness-uploads
      KOPIUR_CAPACITY: 10Gi
      OIDC_DISPLAY_NAME: SparkyFitness
      OIDC_CALLBACK: /api/auth/sso/callback/kanidm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sparkyfitness-frontend
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: sparkyfitness
  dependsOn:
    - name: sparkyfitness
  interval: 1h
  path: "./clusters/psb/apps/selfhosted/sparkyfitness/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
