---
# Deployed through the TrueNAS UI - doco-cd cannot manage itself

secrets:
  webhook_secret:
    file: /home/truenas_admin/.config/doco-cd/webhook_secret

services:
  app:
    container_name: doco-cd
    environment:
      DEPLOY_CONFIG_BASE_DIR: ./docker/truenas/
      HTTP_PORT: 8080
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/trash-panda-v91-beta/nebular-grid.git
          reference: refs/heads/main
          interval: 3600
      TZ: Europe/Prague
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.109.2@sha256:1c7941bd12fe94aea3c2560cb85f775e48928be102f990dfae3aebe5bcb170b3
    ports:
      - 8080:8080
    restart: unless-stopped
    secrets:
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

volumes:
  data: {}
